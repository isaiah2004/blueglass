# ─────────────────────────────────────────────────────────────────────────────
# Alembic configuration for the Atlas Bible API.
#
# The database URL is deliberately absent: db/env.py reads it from the same
# Settings object the application uses, so there is exactly one place a DSN
# comes from and no chance of migrating a different database than the one the
# service talks to.
#
# Usage
#   docker compose run --rm migrate                  # apply everything
#   docker compose exec api alembic revision -m "..." # author a new one
# ─────────────────────────────────────────────────────────────────────────────
[alembic]
script_location = db
prepend_sys_path = .
# Timestamped, ordered, readable filenames: 0003_20260829_add_x.py
file_template = %%(rev)s_%%(year)d%%(month).2d%%(day).2d_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
